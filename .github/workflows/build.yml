name: Build BerryBot

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Tai file mod len
        uses: actions/upload-artifact@v4
        with:
          name: berrybot-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
